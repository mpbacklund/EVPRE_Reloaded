version: '3.9'

services:
  backend:
    build:
      context: ./backend
    volumes: 
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    tty: true
    depends_on:
      - backend

volumes:
  frontend_node_modules: